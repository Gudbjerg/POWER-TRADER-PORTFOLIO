[theme]
base = "light"
primaryColor = "#0e7a7e"
backgroundColor = "#e7ece8"
secondaryBackgroundColor = "#f5f7f4"
textColor = "#132f38"
linkColor = "#2f45c6"
linkUnderline = false
borderColor = "#c9d3ce"
dataframeBorderColor = "#d3dbd6"
dataframeHeaderBackgroundColor = "#edf1ee"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "0.1875rem"
buttonRadius = "0.1875rem"
baseFontSize = 15
font = "Archivo:https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap"
headingFont = "'Big Shoulders Display':https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
codeFontSize = "0.82rem"
codeBackgroundColor = "#edf1ee"
metricValueFontSize = "1.9rem"
redColor = "#c2391f"
orangeColor = "#c2611a"
yellowColor = "#a86a12"
greenColor = "#2f7a47"
blueColor = "#2f45c6"
violetColor = "#6e4a9e"
grayColor = "#667b83"
chartCategoricalColors = ["#0e7a7e", "#2f45c6", "#a86a12", "#c2391f", "#6e4a9e", "#2f7a47", "#1c8fb0", "#c2611a", "#8f8424", "#667b83"]

[theme.sidebar]
backgroundColor = "#edf1ee"
secondaryBackgroundColor = "#f5f7f4"
borderColor = "#c9d3ce"

[client]
toolbarMode = "viewer"

[server]
headless = true
fileWatcherType = "none"

[logger]
level = "error"
